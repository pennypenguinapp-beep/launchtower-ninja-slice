<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ninja Slice — LaunchTower</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#0d0f14; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; color:#e8eaf0; }
  #wrap { position:fixed; inset:0; display:flex; flex-direction:column; }
  #hud { display:flex; justify-content:space-between; align-items:center; padding:10px 16px; font-size:15px; letter-spacing:.5px; user-select:none; }
  #hud .stat { background:#171a22; border:1px solid #262b38; border-radius:8px; padding:6px 14px; }
  #hud .stat b { color:#ffd166; font-size:17px; }
  #combo { position:absolute; top:52px; left:50%; transform:translateX(-50%); font-size:22px; font-weight:700; color:#ff6b6b; opacity:0; transition:opacity .2s; pointer-events:none; text-shadow:0 0 12px rgba(255,107,107,.6); }
  #stage { flex:1; position:relative; overflow:hidden; background:#0d0f14; }
  canvas { position:absolute; left:0; top:0; touch-action:none; cursor:crosshair; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:rgba(10,12,17,.82); backdrop-filter:blur(4px); z-index:5; }
  #overlay h1 { font-size:44px; letter-spacing:2px; background:linear-gradient(90deg,#ff6b6b,#ffd166); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #overlay p { color:#9aa3b5; font-size:15px; max-width:340px; text-align:center; line-height:1.5; }
  .btns { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  button { background:#1c2130; color:#e8eaf0; border:1px solid #313952; border-radius:10px; padding:12px 26px; font-size:16px; cursor:pointer; transition:all .15s; letter-spacing:.5px; }
  button:hover { background:#262d44; border-color:#4a5578; transform:translateY(-1px); }
  button.primary { background:linear-gradient(135deg,#c0392b,#e74c3c); border-color:#e74c3c; font-weight:600; }
  button.primary:hover { filter:brightness(1.15); }
  #endStats { font-size:18px; color:#cfd6e4; text-align:center; line-height:1.7; }
  #endStats b { color:#ffd166; font-size:26px; }
  footer { padding:8px; text-align:center; font-size:12px; color:#55607a; user-select:none; }
  footer a { color:#7d8bb0; text-decoration:none; }
  footer a:hover { color:#a9b6dd; }
  @media (max-width:520px){ #overlay h1{font-size:32px} button{padding:11px 20px;font-size:15px} #hud{font-size:13px;padding:8px 10px} #hud .stat{padding:5px 10px} }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="stat">Score <b id="score">0</b></div>
    <div class="stat" id="timeStat" style="display:none">Time <b id="time">60</b></div>
    <div class="stat">Best <b id="best">0</b></div>
    <div class="stat" id="livesStat">Lives <b id="lives">3</b></div>
  </div>
  <div id="combo"></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="overlay">
      <h1>NINJA SLICE</h1>
      <p>Swipe (or drag with mouse) to slice the flying pixel fruit. Chain slices for combos. Don't slice the bombs — and don't let fruit hit the floor!</p>
      <p style="font-size:13px;color:#6b7488">P / Esc to pause &middot; Space to start</p>
      <div class="btns">
        <button class="primary" id="btnClassic">Classic</button>
        <button class="primary" id="btnTimed">60-Second</button>
      </div>
    </div>
  </div>
  <footer>LaunchTower &middot; <a href="https://pennypenguinapp-beep.github.io/" target="_blank" rel="noopener">more free games &amp; tools</a></footer>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var scoreEl=document.getElementById('score'), bestEl=document.getElementById('best'),
    livesEl=document.getElementById('lives'), timeEl=document.getElementById('time'),
    timeStat=document.getElementById('timeStat'), livesStat=document.getElementById('livesStat'),
    comboEl=document.getElementById('combo'), overlay=document.getElementById('overlay');
var W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  var r=cv.parentElement.getBoundingClientRect();
  var sw=r.width, sh=r.height;
  var s=Math.min(sw/900, sh/700);
  if(s>1.4) s=1.4; if(s<0.4) s=0.4;
  W=900*s; H=700*s;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  cv.style.left=((sw-W)/2)+'px';
  cv.style.top=((sh-H)/2)+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize); resize();

var FRUITS=[
  {name:'tomato', c1:'#e74c3c', c2:'#c0392b', seed:'#f5b041'},
  {name:'lemon',  c1:'#f7dc6f', c2:'#f1c40f', seed:'#d4ac0d'},
  {name:'lime',   c1:'#82e0aa', c2:'#2ecc71', seed:'#1e8449'},
  {name:'plum',   c1:'#bb8fce', c2:'#8e44ad', seed:'#6c3483'},
  {name:'melon',  c1:'#7dcea0', c2:'#27ae60', seed:'#145a32'},
  {name:'orange', c1:'#f5b041', c2:'#e67e22', seed:'#a04000'}
];
var BOMB={name:'bomb', c1:'#2c3e50', c2:'#1a252f', seed:'#e74c3c'};

var state='menu'; // menu | playing | over
var mode='classic';
var score=0, best=0, lives=3, timeLeft=60, lastTick=0;
var objects=[], particles=[], slices=[];
var spawnTimer=0, spawnInterval=1.4, difficulty=0;
var pointerDown=false, trail=[];
var paused=false;

var AC=null;
function beep(freq,dur,vol,type){
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    var o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'square'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.08,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}

try{ best=parseInt(localStorage.getItem('ninjaSliceBest')||'0',10)||0; }catch(e){}
bestEl.textContent=best;

function rand(a,b){ return a+Math.random()*(b-a); }
function pick(arr){ return arr[(Math.random()*arr.length)|0]; }

function spawnObject(){
  var isBomb=Math.random()<Math.min(0.12+difficulty*0.01,0.28);
  var type=isBomb?BOMB:pick(FRUITS);
  var x=rand(W*0.12,W*0.88);
  var vx=rand(-1,1)*W*0.05;
  var vy=-(H*0.011+rand(0,H*0.004)+difficulty*0.0004*H);
  var r=Math.min(W,H)*0.045+rand(0,6);
  objects.push({x:x,y:H+r,vx:vx,vy:vy,r:r,type:type,rot:rand(0,6.28),vr:rand(-0.06,0.06),sliced:false});
  if(!isBomb && Math.random()<0.35){
    var t2=pick(FRUITS);
    objects.push({x:x+rand(-40,40),y:H+r,vx:vx*rand(0.7,1.3),vy:vy*rand(0.9,1.1),r:r*rand(0.85,1.1),type:t2,rot:rand(0,6.28),vr:rand(-0.06,0.06),sliced:false});
  }
}

function burst(x,y,type,n){
  for(var i=0;i<n;i++){
    var a=rand(0,6.28), sp=rand(1,5);
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:1,decay:rand(0.02,0.05),
      color:Math.random()<0.5?type.c1:type.c2,size:rand(2,5)});
  }
}

function drawPixelCircle(x,y,r,type,rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
  var g=ctx.createRadialGradient(-r*0.3,-r*0.3,r*0.1,0,0,r);
  g.addColorStop(0,type.c1); g.addColorStop(1,type.c2);
  ctx.fillStyle=g;
  // pixelated circle: draw as chunky squares
  var step=Math.max(2,Math.round(r/5));
  ctx.beginPath();
  for(var a=0;a<6.283;a+=0.26){
    var px=Math.round(Math.cos(a)*r/step)*step, py=Math.round(Math.sin(a)*r/step)*step;
    if(a===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fill();
  // highlight
  ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.fillRect(-r*0.45,-r*0.55,step*1.5,step*1.5);
  // stem / fuse
  if(type.name==='bomb'){
    ctx.strokeStyle='#555'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(0,-r); ctx.quadraticCurveTo(r*0.3,-r*1.3,r*0.5,-r*1.2); ctx.stroke();
    ctx.fillStyle=type.seed;
    ctx.fillRect(r*0.45,-r*1.35,step,step);
    ctx.fillStyle='#f9e79f';
    ctx.fillRect(r*0.5,-r*1.3,step/2,step/2);
  } else {
    ctx.fillStyle='#27ae60';
    ctx.fillRect(-step/2,-r-step,step,step*1.6);
    ctx.fillStyle=type.seed;
    for(var i=0;i<3;i++) ctx.fillRect(rand(-r*0.5,r*0.5),rand(-r*0.4,r*0.4),step*0.7,step*0.7);
  }
  ctx.restore();
}

function drawHalf(x,y,r,type,rot,side){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
  ctx.beginPath();
  if(side>0){ ctx.arc(0,0,r,0,Math.PI); } else { ctx.arc(0,0,r,Math.PI,0); }
  ctx.closePath();
  var g=ctx.createRadialGradient(0,0,r*0.1,0,0,r);
  g.addColorStop(0,type.c1); g.addColorStop(1,type.c2);
  ctx.fillStyle=g; ctx.fill();
  ctx.restore();
}

function startGame(m){
  mode=m; score=0; objects=[]; particles=[]; slices=[];
  spawnTimer=0; spawnInterval=1.4; difficulty=0;
  if(mode==='classic'){ lives=3; timeStat.style.display='none'; livesStat.style.display=''; }
  else { lives=Infinity; timeLeft=60; timeStat.style.display=''; livesStat.style.display='none'; }
  scoreEl.textContent='0'; bestEl.textContent=best;
  livesEl.textContent=lives===Infinity?'∞':lives;
  timeEl.textContent='60';
  overlay.style.display='none';
  state='playing';
  lastTick=performance.now();
}

function endGame(){
  state='over';
  if(score>best){ best=score; try{ localStorage.setItem('ninjaSliceBest',String(best)); }catch(e){} }
  bestEl.textContent=best;
  var newBest=score>=best && score>0;
  overlay.innerHTML='<h1>'+(score>0?'NICE SLICING!':'GAME OVER')+'</h1>'+
    '<div id="endStats">Score <b>'+score+'</b><br>Best <b>'+best+'</b>'+(newBest?'<br><span style="color:#ff6b6b;font-weight:700">NEW BEST!</span>':'')+'</div>'+
    '<div class="btns"><button class="primary" id="btnAgain">Play Again</button><button id="btnMenu">Menu</button></div>';
  overlay.style.display='flex';
  document.getElementById('btnAgain').onclick=function(){ startGame(mode); };
  document.getElementById('btnMenu').onclick=function(){ showMenu(); };
}

function togglePause(){
  if(state!=='playing') return;
  paused=!paused;
  if(paused){
    overlay.innerHTML='<h1>PAUSED</h1><p>Take a breath. Your fruit is waiting.</p>'+
      '<div class="btns"><button class="primary" id="btnResume">Resume</button><button id="btnQuit">Menu</button></div>';
    overlay.style.display='flex';
    document.getElementById('btnResume').onclick=function(){ togglePause(); };
    document.getElementById('btnQuit').onclick=function(){ paused=false; showMenu(); };
  } else {
    overlay.style.display='none';
    lastTick=performance.now();
  }
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden && state==='playing' && !paused) togglePause();
});
window.addEventListener('keydown',function(e){
  if(e.key==='p'||e.key==='P'||e.key==='Escape'){ if(state==='playing') togglePause(); }
  else if(e.key===' '||e.key==='Enter'){
    if(state==='menu'){ startGame('classic'); }
    else if(state==='over'){ startGame(mode); }
  }
});

function showMenu(){
  state='menu';
  overlay.innerHTML='<h1>NINJA SLICE</h1>'+
    '<p>Swipe (or drag with mouse) to slice the flying pixel fruit. Chain slices for combos. Don\'t slice the bombs — and don\'t let fruit hit the floor!</p>'+
    '<p style="font-size:13px;color:#6b7488">P / Esc to pause &middot; Space to start</p>'+
    '<div class="btns"><button class="primary" id="btnClassic">Classic</button><button class="primary" id="btnTimed">60-Second</button></div>';
  overlay.style.display='flex';
  document.getElementById('btnClassic').onclick=function(){ startGame('classic'); };
  document.getElementById('btnTimed').onclick=function(){ startGame('timed'); };
}
showMenu();

document.getElementById('btnClassic').onclick=function(){ startGame('classic'); };
document.getElementById('btnTimed').onclick=function(){ startGame('timed'); };

function getPos(e){
  var r=cv.getBoundingClientRect();
  var t;
  if(e.touches && e.touches.length) t=e.touches[0];
  else if(e.changedTouches && e.changedTouches.length) t=e.changedTouches[0];
  else t=e;
  return {x:t.clientX-r.left, y:t.clientY-r.top};
}

function onDown(e){
  if(state!=='playing') return;
  pointerDown=true; trail=[];
  var p=getPos(e); trail.push({x:p.x,y:p.y,t:performance.now()});
  e.preventDefault();
}
function onMove(e){
  if(!pointerDown||state!=='playing') return;
  var p=getPos(e);
  var last=trail[trail.length-1];
  trail.push({x:p.x,y:p.y,t:performance.now()});
  if(trail.length>24) trail.shift();
  // slice test against segment last->p
  if(last){
    var dx=p.x-last.x, dy=p.y-last.y;
    if(dx*dx+dy*dy>16){
      var now=performance.now();
      slices.push({x1:last.x,y1:last.y,x2:p.x,y2:p.y,t:now});
      checkSlices(last.x,last.y,p.x,p.y);
    }
  }
  e.preventDefault();
}
function onUp(){ pointerDown=false; }

function segCircle(x1,y1,x2,y2,cx,cy,r){
  var dx=x2-x1, dy=y2-y1;
  var len2=dx*dx+dy*dy;
  if(len2===0) return (cx-x1)*(cx-x1)+(cy-y1)*(cy-y1)<=r*r;
  var t=((cx-x1)*dx+(cy-y1)*dy)/len2;
  t=Math.max(0,Math.min(1,t));
  var px=x1+t*dx-cx, py=y1+t*dy-cy;
  return px*px+py*py<=r*r;
}

var comboCount=0, comboTimer=0;
function checkSlices(x1,y1,x2,y2){
  var hitAny=false;
  for(var i=0;i<objects.length;i++){
    var o=objects[i];
    if(o.sliced) continue;
    if(segCircle(x1,y1,x2,y2,o.x,o.y,o.r)){
      o.sliced=true;
      if(o.type.name==='bomb'){
        burst(o.x,o.y,o.type,26);
        beep(110,0.25,0.12,'sawtooth');
        if(mode==='classic'){
          lives--; livesEl.textContent=lives;
          if(lives<=0){ endGame(); return; }
        } else {
          score=Math.max(0,score-50); scoreEl.textContent=score;
        }
        comboCount=0; comboEl.style.opacity=0;
      } else {
        hitAny=true;
        score+=10; scoreEl.textContent=score;
        beep(660+Math.random()*220,0.09,0.07,'square');
        burst(o.x,o.y,o.type,14);
        // two halves fly apart
        var ang=Math.atan2(y2-y1,x2-x1)+Math.PI/2;
        objects.push({x:o.x,y:o.y,vx:Math.cos(ang)*2.2,vy:-1.5,r:o.r*0.8,type:o.type,rot:o.rot,vr:0.12,half:1,life:1});
        objects.push({x:o.x,y:o.y,vx:-Math.cos(ang)*2.2,vy:-1.5,r:o.r*0.8,type:o.type,rot:o.rot,vr:-0.12,half:-1,life:1});
        objects.splice(i,1); i--;
      }
    }
  }
  if(hitAny){
    comboCount++;
    comboTimer=performance.now();
    if(comboCount>=2){
      var bonus=(comboCount-1)*5;
      score+=bonus; scoreEl.textContent=score;
      comboEl.textContent='COMBO x'+comboCount+'  +'+bonus;
      comboEl.style.opacity=1;
    }
  }
}

function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min((now-lastTick)/1000,0.05); lastTick=now;
  if(state!=='playing'||paused){ drawIdle(now); return; }

  // difficulty ramp
  difficulty+=dt*0.15;
  spawnInterval=Math.max(0.55,1.4-difficulty*0.03);
  spawnTimer+=dt;
  if(spawnTimer>=spawnInterval){ spawnTimer=0; spawnObject(); }

  // timed mode clock
  if(mode==='timed'){
    timeLeft-=dt;
    timeEl.textContent=Math.max(0,Math.ceil(timeLeft));
    if(timeLeft<=0){ endGame(); return; }
  }

  // combo decay
  if(comboCount>0 && now-comboTimer>900){ comboCount=0; comboEl.style.opacity=0; }

  // update objects
  for(var i=objects.length-1;i>=0;i--){
    var o=objects[i];
    o.x+=o.vx; o.y+=o.vy; o.rot+=o.vr;
    if(o.half){ o.vy+=0.18; o.life-=dt*0.9; if(o.life<=0||o.y>H+60){ objects.splice(i,1); continue; } }
    else if(o.y>H+o.r*2 && o.vy>0){
      objects.splice(i,1);
      if(o.type.name!=='bomb'){
        if(mode==='classic'){
          lives--; livesEl.textContent=lives;
          if(lives<=0){ endGame(); return; }
        } else {
          score=Math.max(0,score-20); scoreEl.textContent=score;
        }
      }
      continue;
    }
    if(o.x<-80||o.x>W+80) { objects.splice(i,1); }
  }

  // particles
  for(var j=particles.length-1;j>=0;j--){
    var p=particles[j];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.life-=p.decay;
    if(p.life<=0) particles.splice(j,1);
  }

  // slices fade
  var cutoff=now-220;
  while(slices.length && slices[0].t<cutoff) slices.shift();

  // ---- draw ----
  ctx.clearRect(0,0,W,H);
  // subtle grid
  ctx.strokeStyle='rgba(255,255,255,0.03)'; ctx.lineWidth=1;
  var gs=40;
  for(var gx=0;gx<W;gx+=gs){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,H); ctx.stroke(); }
  for(var gy=0;gy<H;gy+=gs){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); }

  // particles
  for(var k=0;k<particles.length;k++){
    var pt=particles[k];
    ctx.globalAlpha=Math.max(0,pt.life);
    ctx.fillStyle=pt.color;
    ctx.fillRect(pt.x-pt.size/2,pt.y-pt.size/2,pt.size,pt.size);
  }
  ctx.globalAlpha=1;

  // objects
  for(var m=0;m<objects.length;m++){
    var ob=objects[m];
    if(ob.half){ ctx.globalAlpha=Math.max(0,ob.life); drawHalf(ob.x,ob.y,ob.r,ob.type,ob.rot,ob.half); ctx.globalAlpha=1; }
    else drawPixelCircle(ob.x,ob.y,ob.r,ob.type,ob.rot);
  }

  // blade trail
  if(slices.length){
    ctx.lineCap='round'; ctx.lineJoin='round';
    for(var s=0;s<slices.length;s++){
      var sl=slices[s];
      var age=(now-sl.t)/220;
      ctx.strokeStyle='rgba(255,255,255,'+(0.85*(1-age))+')';
      ctx.lineWidth=5*(1-age)+1;
      ctx.beginPath(); ctx.moveTo(sl.x1,sl.y1); ctx.lineTo(sl.x2,sl.y2); ctx.stroke();
      ctx.strokeStyle='rgba(160,220,255,'+(0.4*(1-age))+')';
      ctx.lineWidth=10*(1-age)+2;
      ctx.beginPath(); ctx.moveTo(sl.x1,sl.y1); ctx.lineTo(sl.x2,sl.y2); ctx.stroke();
    }
  }
}

function drawIdle(now){
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,0.03)';
  var gs=40;
  for(var gx=0;gx<W;gx+=gs){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,H); ctx.stroke(); }
  for(var gy=0;gy<H;gy+=gs){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); }
}

requestAnimationFrame(loop);

cv.addEventListener('mousedown',onDown);
window.addEventListener('mousemove',onMove);
window.addEventListener('mouseup',onUp);
cv.addEventListener('touchstart',onDown,{passive:false});
cv.addEventListener('touchmove',onMove,{passive:false});
cv.addEventListener('touchend',onUp);
cv.addEventListener('touchcancel',onUp);
})();
</script>
<div style="position:fixed;bottom:4px;left:0;right:0;text-align:center;font-size:11px;color:#8b949e;z-index:99;">More free tools &amp; games: <a href="https://pennypenguinapp-beep.github.io/" style="color:#58a6ff;">LaunchTower</a></div>
</body>
